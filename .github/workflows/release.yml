name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    # A tag publishes only a commit whose full CI run succeeded, on every
    # platform and Python version. The tag and its CI run start in the same
    # second, so without this wait a release was on PyPI before a single test
    # had finished.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Wait for the CI run of this commit and require its success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$id"
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status

  verify:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # A tag is a claim about which version is being released and which commit
      # carries it, and nothing else checks either. Tagging v0.2.0 against a
      # pyproject that still says 0.1.0 publishes 0.1.0 under a tag that says
      # otherwise, and PyPI will not let that file name be reused once it is
      # wrong. The version is written in two places, so both are held to it.
      - name: The tag has to be the head of master and the version being built
        run: |
          git fetch --depth=1 origin master:refs/remotes/origin/master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"
          python - <<'CHECK'
          import os, pathlib, re, sys

          tag = os.environ["GITHUB_REF_NAME"]
          declared = {
              path: re.search(pattern, pathlib.Path(path).read_text(encoding="utf-8"), re.M).group(1)
              for path, pattern in (
                  ("pyproject.toml", r'^version = "([^"]+)"'),
                  ("src/unmasker/__init__.py", r'^__version__ = "([^"]+)"'),
              )
          }
          wrong = {path: version for path, version in declared.items() if tag != f"v{version}"}
          if wrong:
              sys.exit(f"tag {tag} does not match {wrong}")
          print(f"{tag} matches {', '.join(declared)}")
          CHECK

      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify
        run: |
          ruff check .
          pytest
          mypy

  build:
    # Built once: the files checked here are the files PyPI and the release
    # page receive, byte for byte.
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      # The same assertion CI makes on every push. It is repeated here because
      # this is the artifact that actually reaches people, and a wheel missing
      # its typing marker is invisible until somebody imports the package.
      - name: The typing marker has to be inside the wheel
        run: |
          python - <<'CHECK'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "unmasker/py.typed" in names, names
          CHECK

      # Install the built wheel in a clean interpreter and run the console
      # script. Mypy passing is not the program running, and neither is a green
      # test suite executed from a checkout.
      - name: Install what was built and run it
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/pip" install dist/*.whl
          test "$("$RUNNER_TEMP/installed/bin/unmasker" --version)" = "unmasker ${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    # Trusted Publishing: PyPI verifies this workflow's identity over OIDC, so
    # there is no API token to store, rotate or leak. `id-token: write` is what
    # mints that identity and is the only permission this needs.
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest

    # The release page carries the changelog's section for this version and
    # the files PyPI received, so the two cannot say different things.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "${GITHUB_REF_NAME#v}" > notes.md <<'NOTES'
          import pathlib, re, sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |^\[[^\]]+\]: |\Z)", text, re.S | re.M
          )
          if section is None:
              sys.exit(f"CHANGELOG.md has no section for {version}")

          # The changelog is wrapped for a terminal, and a release page turns
          # every one of those line breaks into a visible one.
          lines = []
          for line in section.group(1).strip().splitlines():
              starts_block = not line.strip() or line.startswith(("#", "- "))
              continues = lines and lines[-1].strip() and not lines[-1].startswith("#")
              if starts_block or not continues:
                  lines.append(line)
              else:
                  lines[-1] += " " + line.strip()
          print("\n".join(lines))
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --title "unmasker ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag --latest

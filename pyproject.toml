[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "unmasker"
version = "0.7.0"
description = "What a human sees in a document, against what a machine reads out of it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# The hyphen is not a typo and is not the GitHub account, which is
# `osintshifu`. This is the PyPI username, which is spelled with one and
# cannot be changed. Making the two match would mean naming an account
# that does not own this package.
authors = [{ name = "osint-shifu" }]
keywords = [
  "redaction",
  "pdf",
  "forensics",
  "prompt-injection",
  "document-analysis",
  "hidden-text",
  "osint",
  "dfir",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Text Processing",
  "Topic :: Utilities",
]

# One dependency, and it was checked rather than assumed. pypdf is BSD-3-Clause,
# pure Python and has no transitive dependencies. A second one has to earn its
# place the same way, in writing.
dependencies = ["pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.urls]
Homepage = "https://github.com/osintshifu/unmasker"
Repository = "https://github.com/osintshifu/unmasker"
Issues = "https://github.com/osintshifu/unmasker/issues"
Changelog = "https://github.com/osintshifu/unmasker/blob/master/CHANGELOG.md"

[project.scripts]
unmasker = "unmasker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unmasker"]
# PEP 561: without the marker inside the wheel, every annotation in this
# package is invisible to anything that imports it as a library.
artifacts = ["src/unmasker/py.typed"]

# What a source distribution carries, stated rather than left to .gitignore:
# hatchling reads .gitignore and not .git/info/exclude, so a build made in a
# working checkout picked up whatever local notes sat beside the project.
[tool.hatch.build.targets.sdist]
only-include = [
  ".editorconfig",
  ".github",
  ".gitignore",
  ".pre-commit-config.yaml",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "assets",
  "pyproject.toml",
  "src/unmasker",
  "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src/unmasker"]

# Everything below already passes. Each one is here to keep it that way rather
# than as an aspiration: a flag nothing satisfies is a comment, not a check.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
